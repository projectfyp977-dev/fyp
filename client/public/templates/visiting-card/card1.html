<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card Design 1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: linear-gradient(160deg, #f0f4f8 0%, #e2e8f0 100%); padding: 4rem 1rem; display: flex; flex-direction: column; gap: 4rem; align-items: center; font-family: 'Segoe UI', system-ui, sans-serif; }
        :root { --cyan: #0ea5e9; --dark-navy: #0f172a; --text-dark: #1e293b; --muted: #64748b; }
        .business-card { width: 100%; max-width: 900px; aspect-ratio: 3.5 / 2; background: #fff; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.04); position: relative; padding: 2.25rem; overflow: hidden; }
        .card-accent { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, var(--cyan) 0%, #06b6d4 50%, var(--cyan) 100%); }
        .card-accent-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: var(--dark-navy); opacity: 0.9; }
        .card-dot { position: absolute; top: 1.5rem; right: 1.5rem; width: 10px; height: 10px; background: var(--cyan); border-radius: 50%; opacity: 0.6; }
        .card-front-content { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .logo-wrap { margin-bottom: 1.25rem; }
        .logo-wrap img { max-width: 100px; max-height: 70px; object-fit: contain; }
        .logo-wrap svg { width: 88px; height: 88px; }
        .brand-name { font-size: 2.4rem; font-weight: 800; color: var(--text-dark); letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 0.35rem; }
        .tagline { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.2em; font-weight: 600; color: var(--muted); }
        .card-back-content { height: 100%; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 2rem; }
        .divider-line { width: 1px; height: 70%; background: linear-gradient(180deg, transparent, #e2e8f0, transparent); justify-self: center; }
        .name-side { text-align: center; padding-right: 1rem; }
        .name-side h2 { font-size: 2.2rem; font-weight: 700; color: var(--cyan); letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 0.4rem; }
        .name-side p { font-size: 1.1rem; font-weight: 500; color: var(--text-dark); }
        .contact-side { display: flex; flex-direction: column; gap: 0.75rem; padding-left: 1rem; }
        .contact-item { display: flex; align-items: center; gap: 0.75rem; font-size: 0.95rem; color: var(--text-dark); }
        .contact-item svg { width: 20px; height: 20px; stroke: var(--dark-navy); fill: none; stroke-width: 2; flex-shrink: 0; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="business-card">
        <div class="card-accent"></div>
        <div class="card-accent-bottom"></div>
        <div class="card-dot"></div>
        <div class="card-front-content">
            <div class="logo-wrap">{{logoImg}}</div>
            <h1 class="brand-name">{{company}}</h1>
            <p class="tagline">{{tagline}}</p>
        </div>
    </div>
    <div class="business-card">
        <div class="card-accent"></div>
        <div class="card-accent-bottom"></div>
        <div class="card-dot"></div>
        <div class="card-back-content">
            <div class="name-side">
                <h2>{{fullName}}</h2>
                <p>{{jobTitle}}</p>
            </div>
            <div class="divider-line"></div>
            <div class="contact-side">
                <div class="contact-item"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>{{address}}</span></div>
                <div class="contact-item"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>{{phone}}</span></div>
                <div class="contact-item"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg><span>{{email}}</span></div>
                <div class="contact-item"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><span>{{website}}</span></div>
            </div>
        </div>
    </div>
</body>
</html>
