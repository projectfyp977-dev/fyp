<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card Design 3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { min-height: 100vh; background: linear-gradient(90deg, #cccccc 50%, #eeeeee 50%); padding: 4rem 1rem; display: flex; flex-direction: column; gap: 4rem; align-items: center; }
        :root { --dark-teal: #00272e; }
        .wave-pattern-dark { background-image: radial-gradient(circle at 50% 100%, transparent 68%, rgba(255,255,255,0.05) 68%, rgba(255,255,255,0.05) 72%, transparent 72%); background-size: 120px 80px; }
        .wave-pattern-light { background-image: radial-gradient(circle at 50% 100%, transparent 68%, rgba(0,0,0,0.05) 68%, rgba(0,0,0,0.05) 72%, transparent 72%); background-size: 120px 80px; }
        .business-card { width: 100%; max-width: 820px; aspect-ratio: 3.5 / 2; border-radius: 28px; box-shadow: 0 18px 40px rgba(0,0,0,0.25); position: relative; padding: 2.5rem; overflow: hidden; }
        .card-teal-dark { background: linear-gradient(90deg, #001e24, #003942); color: white; }
        .card-front-teal-content { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .double-circle-logo-white { width: 130px; margin-bottom: 0.8rem; }
        .brand-name-teal { font-size: 2.2rem; line-height: 1; margin-bottom: 0.2rem; }
        .brand-name-teal span { font-weight: 300; }
        .tagline-teal { opacity: 0.8; font-size: 1.1rem; font-weight: 300; }
        .card-teal-white { background-color: white; color: var(--dark-teal); }
        .card-back-teal-content { height: 100%; display: grid; grid-template-columns: 1fr 1fr; }
        .contact-left-side h2 { font-size: 2.7rem; font-weight: 700; line-height: 1; padding-bottom: 0.6rem; border-bottom: 2px solid var(--dark-teal); margin-bottom: 0.6rem; }
        .contact-left-side .job-title { font-size: 1.15rem; opacity: 0.8; margin-bottom: 1.8rem; }
        .contact-list-teal { display: flex; flex-direction: column; gap: 0.9rem; }
        .contact-item-teal { display: flex; align-items: center; gap: 0.8rem; font-size: 1.2rem; opacity: 0.9; }
        .contact-item-teal svg { width: 38px; height: 38px; stroke: var(--dark-teal); fill: transparent; stroke-width: 1.3; border-radius: 50%; padding: 6px; border: 1px solid var(--dark-teal); }
        .logo-right-side { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .double-circle-logo-dark { width: 110px; margin-bottom: 0.6rem; }
    </style>
</head>
<body>
    <div class="business-card card-teal-dark wave-pattern-dark">
        <div class="card-front-teal-content">
            {{logoImg}}
            <h1 class="brand-name-teal">{{company}}</h1>
            <p class="tagline-teal">{{tagline}}</p>
        </div>
    </div>
    <div class="business-card card-teal-white wave-pattern-light">
        <div class="card-back-teal-content">
            <div class="contact-left-side">
                <h2>{{fullName}}</h2>
                <p class="job-title">{{jobTitle}}</p>
                <div class="contact-list-teal">
                    <div class="contact-item-teal"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>{{phone}}</span></div>
                    <div class="contact-item-teal"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg><span>{{email}}</span></div>
                    <div class="contact-item-teal"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>{{address}}</span></div>
                    <div class="contact-item-teal"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><span>{{website}}</span></div>
                </div>
            </div>
            <div class="logo-right-side">
                <svg class="double-circle-logo-dark" viewBox="0 0 160 120" fill="#00272e"><circle cx="45" cy="75" r="35"/><circle cx="115" cy="45" r="35"/><rect x="60" y="45" width="40" height="30" fill="white"/></svg>
                <h1 class="brand-name-teal" style="color: var(--dark-teal)">{{company}}</h1>
                <p class="tagline-teal" style="color: var(--dark-teal)">{{tagline}}</p>
            </div>
        </div>
    </div>
</body>
</html>
