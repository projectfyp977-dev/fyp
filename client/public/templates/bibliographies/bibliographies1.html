<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Biographics</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; font-family: 'Georgia', serif; }
    .letterhead { width: 21cm; min-height: auto; background: #a8d5d5; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; padding: 3cm 2.5cm 2.5cm; color: #333; display: flex; flex-direction: column; gap: 1.5cm; }
    .shape-top { position: absolute; top: 0; right: 0; width: 8cm; height: 8cm; background: rgba(255,255,255,0.25); border-radius: 0 0 0 100%; pointer-events: none; }
    .shape-mid { position: absolute; bottom: 4cm; left: -2cm; width: 6cm; height: 6cm; border: 3px solid rgba(255,255,255,0.4); border-radius: 50%; pointer-events: none; }
    .header { display: flex; align-items: center; justify-content: space-between; }
    .logo-text { font-size: 1.1rem; font-weight: bold; color: #2d5a5a; line-height: 1.3; }
    .logo-text span { display: block; font-size: 0.85rem; color: #4a7c7c; font-weight: 500; }
    .body-text { font-size: 0.9rem; line-height: 1.75; color: #444; padding-right: 2cm; flex: 1; min-height: 4cm; }
    .signature { margin-top: auto; padding-top: 1.5cm; border-top: 2px solid rgba(45,90,90,0.3); text-align: left; }
    .signature-name { font-size: 1.1rem; font-weight: bold; color: #c23a2e; margin-bottom: 0.15cm; }
    .signature-title { font-size: 0.85rem; color: #555; }
  </style>
</head>
<body>
  <div class="letterhead">
    <div class="shape-top"></div>
    <div class="shape-mid"></div>
    <div class="header">
      <div class="logo-text">{{company}}<br><span>{{platform}}</span></div>
    </div>
    <div class="body-text">{{body}}</div>
    <div class="signature">
      <div class="signature-name">{{fullName}}</div>
      <div class="signature-title">{{jobTitle}}</div>
    </div>
  </div>
</body>
</html>
