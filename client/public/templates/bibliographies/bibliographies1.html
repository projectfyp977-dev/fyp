<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Letterhead</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; font-family: 'Arial', sans-serif; }
    .letterhead { width: 21cm; height: 29.7cm; background: #a8d5d5; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; padding: 3cm 2cm 2cm; color: #333; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1cm; }
    .logo-text { font-size: 1rem; font-weight: bold; color: #333; line-height: 1; }
    .logo-text span { display: block; font-size: 0.8rem; color: #666; }
    .body-text { margin-left: 0.5cm; font-size: 0.85rem; line-height: 1.6; color: #555; margin-bottom: 1cm; }
    .signature { position: absolute; bottom: 3cm; left: 2cm; text-align: center; }
    .signature-name { font-size: 1rem; font-weight: bold; color: #e74c3c; margin-bottom: 0.2cm; }
    .signature-title { font-size: 0.8rem; color: #666; }
  </style>
</head>
<body>
  <div class="letterhead">
    <div class="header">
      <div class="logo-text">{{company}}<br><span>Platform</span></div>
    </div>
    <div class="body-text">{{body}}</div>
    <div class="signature">
      <div class="signature-name">{{fullName}}</div>
      <div class="signature-title">{{jobTitle}}</div>
    </div>
  </div>
</body>
</html>
