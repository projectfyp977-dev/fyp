<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Letterhead</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; font-family: 'Arial', sans-serif; }
    .letterhead { width: 21cm; height: 29.7cm; background: white; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; padding: 3cm 2cm 2cm; color: #333; }
    .header-text { font-size: 1.6rem; font-weight: bold; line-height: 1; }
    .header-text span { display: block; font-size: 1rem; color: #00bfa5; }
    .headline { font-size: 1.4rem; font-weight: bold; margin-bottom: 1cm; }
    .body-text { font-size: 0.85rem; line-height: 1.6; color: #555; margin-bottom: 2cm; }
    .bottom-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 3cm; background: #00bfa5; color: white; display: flex; align-items: center; padding: 0 2cm; justify-content: space-between; }
    .signature-name { font-size: 1rem; font-weight: bold; }
    .signature-title { font-size: 0.8rem; color: #ccc; }
  </style>
</head>
<body>
  <div class="letterhead">
    <div class="header-text">{{company}}<br><span>Platform</span></div>
    <div class="headline">{{title}}</div>
    <div class="body-text">{{body}}</div>
    <div class="bottom-bar">
      <div></div>
      <div style="text-align:right;">
        <div class="signature-name">{{fullName}}</div>
        <div class="signature-title">{{jobTitle}}</div>
      </div>
    </div>
  </div>
</body>
</html>
