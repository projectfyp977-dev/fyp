<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Poster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #faf6e9; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Georgia', serif; padding: 20px; }
    .poster { width: 21cm; height: 29.7cm; background: #0d4a4a; position: relative; box-shadow: 0 5px 20px rgba(0,0,0,0.1); overflow: hidden; color: #fff; display: flex; flex-direction: column; }
    .content-wrapper { padding: 2cm 2cm 0; flex-grow: 1; display: flex; justify-content: space-between; align-items: flex-start; }
    .text-column { max-width: 60%; }
    .brand-name { font-size: 0.9rem; letter-spacing: 1px; margin-bottom: 0.5cm; font-weight: bold; }
    .headline { font-size: 2.3rem; line-height: 1.1; font-weight: 300; margin-bottom: 0.5cm; }
    .subhead { font-size: 0.85rem; line-height: 1.4; color: #ccc; margin-bottom: 1cm; font-weight: 300; }
    .website { font-size: 0.8rem; color: #ddd; margin-bottom: 1cm; }
    .image-section { width: 100%; margin-top: 1cm; overflow: hidden; border-top: 1px solid #faf6e9; }
    .image-section img { width: 100%; height: auto; display: block; object-fit: cover; }
  </style>
</head>
<body>
  <div class="poster">
    <div class="content-wrapper">
      <div class="text-column">
        <div class="brand-name">{{company}}</div>
        <h1 class="headline">{{headline}}</h1>
        <p class="subhead">{{subhead}}</p>
        <div class="website">{{website}}</div>
      </div>
    </div>
    <div class="image-section">
      <img src="{{photo}}" alt="" onerror="this.style.display='none'"/>
    </div>
  </div>
</body>
</html>
