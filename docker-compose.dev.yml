# Development Docker Compose - Hot reload, volume mounts, dev tools
services:
  mysql:
    image: mysql:8
    container_name: voice-cv-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-devpassword}
      MYSQL_DATABASE: ${DB_NAME:-voice_cv_maker}
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - voice-cv-net

  server:
    image: node:20-alpine
    container_name: voice-cv-server-dev
    working_dir: /app/server
    command: sh -c "npm install && npm run dev"
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - server_node_modules:/app/server/node_modules
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: mysql
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      DB_NAME: ${DB_NAME:-voice_cv_maker}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-prod}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - voice-cv-net

  client:
    image: node:20-alpine
    container_name: voice-cv-client-dev
    working_dir: /app/client
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - client_node_modules:/app/client/node_modules
    environment:
      - CI=true
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:5000/api
    depends_on:
      - server
    networks:
      - voice-cv-net

volumes:
  mysql_dev_data:
  server_node_modules:
  client_node_modules:

networks:
  voice-cv-net:
    driver: bridge
